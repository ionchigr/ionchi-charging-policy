<div class="bsub">充电站政策库<br>GR 内部参考</div>

<div class="panel" id="p-mgmt">

<span class="cnt" id="n-mgmt"></span></div>
<div id="l-mgmt"></div></div>

<div class="panel" id="p-ba">

<span class="cnt" id="n-ba"></span></div>
<div id="l-ba"></div></div>

<div class="panel" id="p-daily">
<div class="fbar"><span style="font-size:12px;color:var(--mt)">按发布日期倒序 · 近期充电政策与监管动态</span><span class="cnt" id="n-daily"></span></div>
<div id="l-daily"></div></div>

<div class="empty" id="empty" style="display:none">暂无匹配内容</div>
</main>

function filter(tab){
  let d=DATA[tab];
  if(tab!=="daily"){const city=document.getElementById("c-"+tab).value;
  const seg=document.getElementById("g-"+tab);let kv="";
  if(seg){const on=seg.querySelector("span.on");if(on)kv=on.dataset.v}
  if(city&&city!=="全部")d=d.filter(i=>i.city===city);
  if(kv)d=d.filter(i=>(seg.dataset.key==="level"?i.level:i[seg.dataset.key])===kv);}
  if(kw){const k=kw.toLowerCase();d=d.filter(i=>JSON.stringify(i).toLowerCase().includes(k))}
  return d;
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(tab){
  const d=filter(tab);const el=document.getElementById("l-"+tab);
  document.getElementById("n-"+tab).textContent="共 "+d.length+" 条";
  el.innerHTML="";EMPTY.style.display=d.length?"none":"block";
  d.forEach(it=>{
    const c=document.createElement("div");c.className="card";let inner="";
    if(tab==="sub"){
      inner=`<div class="ch"><div class="meta"><span class="city">${esc(it.city)}</span><span class="badge ${LMAP[it.level]||"b-none"}">${esc(it.level)}</span><span class="year">${esc(it.cat)}</span></div><div class="ttl">${esc(it.req)}</div></div>
      <div class="det"><div class="k"><b>政策依据：</b>${esc(it.polname)}</div>${it.url?`<a class="ob" href="${esc(it.url)}" target="_blank">查看原文 →</a>`:""}</div>
      <div class="exp"><span>点击展开详情</span><span class="ar">▾</span></div>`;
    }else if(tab==="mgmt"){
      inner=`<div class="ch"><div class="meta"><span class="city">${esc(it.city)}</span><span class="badge ${SMAP[it.status]||"b-none"}">${esc(it.status)}</span><span class="year">${esc(it.year)}</span></div><div class="ttl">${esc(it.title)}</div></div>
      <div class="sm">${esc(it.sum)}</div>
      <div class="det"><a class="ob" href="${esc(it.link)}" target="_blank">查看原文 →</a></div>
      <div class="exp"><span>点击展开详情</span><span class="ar">▾</span></div>`;
    }else if(tab==="ba"){
      inner=`<div class="ch"><div class="meta"><span class="city">${esc(it.city)}</span><span class="badge ${RMAP[it.risk]||"b-none"}">${esc(it.risk)}</span></div><div class="ttl">${esc(it.type)}</div></div>
      <div class="det"><div class="k"><b>备案要求：</b>${esc(it.req)}</div><div class="k"><b>当前状态：</b>${esc(it.status)}</div><div class="k"><b>监管平台：</b>${esc(it.platform)}</div><div class="k"><b>政策依据：</b>${esc(it.polname)}</div>${it.url?`<a class="ob" href="${esc(it.url)}" target="_blank">查看政策原文 →</a>`:""}</div>
      <div class="exp"><span>点击展开详情</span><span class="ar">▾</span></div>`;
    }else if(tab==="daily"){
      inner=`<div class="ch"><div class="meta"><span class="year" style="color:var(--accent);font-weight:600">${esc(it.date)}</span><span class="city">${esc(it.src)}</span></div><div class="ttl">${esc(it.title)}</div></div>
      <div class="sm">${esc(it.sum)}</div>
      <div class="det"><a class="ob" href="${esc(it.link)}" target="_blank">查看原文 →</a></div>
      <div class="exp"><span>点击展开详情</span><span class="ar">▾</span></div>`;
    }
    c.innerHTML=inner;
    c.onclick=e=>{if(e.target.closest("a"))return;c.classList.toggle("open");c.querySelector(".exp span").textContent=c.classList.contains("open")?"收起详情":"点击展开详情"};
    el.appendChild(c);
  });
}
function doSearch(){kw=document.getElementById("kw").value.trim();render(curTab)}
document.getElementById("kw").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch()});
render("sub");
</script></body></html>
